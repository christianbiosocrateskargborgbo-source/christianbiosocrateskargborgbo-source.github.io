<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>BO SPIN 11:51</title>
<style>
body{margin:0;background:#0a0a0a;color:#fff;text-align:center;font-family:sans-serif}
.b{background:linear-gradient(90deg,gold,#ff6b00);color:#000;padding:12px;font-weight:bold}
#a{display:flex;flex-wrap:wrap;justify-content:center;gap:18px;padding:24px}
.d{width:90px;height:90px;border-radius:50%;cursor:pointer;border:3px solid #fff;animation:r 1.2s linear infinite}
@keyframes r{to{transform:rotate(360deg)}}
</style>
</head>
<body>
<div class="b">KARGBO 11:51 - SPINNING ATOMS 🔊</div>
<h2>Capture <span style="color:#0f8">ATOMS</span></h2>
<div style="background:#1a1a2e;margin:12px;padding:14px;border-radius:12px;font-size:22px">
SCORE: <span id="s">0</span>
</div>
<div id="a"></div>
<script>
let S=0;
let C=['#0f8','#0af','#f34','#fd0','#a4f','#f80'];
let F=[330,392,494,523,659,880];
let AC=null;
function beep(f){
 try{
  if(!AC) AC=new AudioContext();
  let o=AC.createOscillator();
  let g=AC.createGain();
  o.frequency.value=f;
  o.connect(g);
  g.connect(AC.destination);
  g.gain.setValueAtTime(0.4,AC.currentTime);
  g.gain.exponentialRampToValueAtTime(0.01,AC.currentTime+0.4);
  o.start();
  o.stop(AC.currentTime+0.4);
 }catch(e){}
}
let box=document.getElementById('a');
for(let i=0;i<6;i++){
 let d=document.createElement('div');
 d.className='d';
 d.style.background='radial-gradient(circle at 30% 30%, #fff,'+C[i]+', #000)';
 d.style.boxShadow='0 0 22px '+C[i];
 d.style.borderColor=C[i];
 d.onclick=function(){
  S+=10;
  document.getElementById('s').innerText=S;
  beep(F[i]);
  this.style.transform='scale(1.4)';
  let t=this;
  setTimeout(function(){t.style.transform='scale(1)'},120);
 };
 box.appendChild(d);
}
</script>
</body>
</html>
