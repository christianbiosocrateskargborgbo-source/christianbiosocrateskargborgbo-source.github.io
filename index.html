
<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>BO-ATOM • Kargbo Throne White</title>
<style>
body{margin:0;background:#0a0a0a;color:#fff;font-family:sans-serif;text-align:center}
.banner{background:#FFD700;color:#000;padding:12px;font-weight:bold}
#atom{width:120px;height:120px;margin:40px auto;background:radial-gradient(circle,#00ff88,#004422);border-radius:50%;animation:spin 2s linear infinite;box-shadow:0 0 30px #00ff88;cursor:pointer}
@keyframes spin{from{transform:rotate(0deg) scale(1)}to{transform:rotate(360deg) scale(1)}}
.scorebox{background:#1a1a2e;padding:15px;margin:20px;border-radius:12px;font-size:22px}
button{background:#000;color:#00ff88;border:2px solid #00ff88;padding:10px 20px;border-radius:8px}
</style>
</head>
<body>
<div class="banner">👑 KARGBO THRONE WHITE 10:45 👑<br>WHITE WORKS - Bo City 6 Legends LIVE</div>
<div style="padding:10px;background:#0a0a0a;display:flex;justify-content:space-between;align-items:center"><span>BO-<span style="color:#00ff88">ATOM</span> • BioSocrates</span><button onclick="reset()">RESET</button></div>
<h1>Capture the <span style="color:#00ff88">ATOM</span></h1>
<p>Tap green core, avoid red. Footer FIXED!</p>
<div class="scorebox">SCORE: <span id="s">0</span></div>
<div id="atom" onclick="capture()"></div>
<div style="padding:20px;margin-top:60px;border-top:1px solid #333">© Bo City • BioSocrates S3 • Kargbo 10</div>
<script>
let score=0;
function capture(){score+=10;document.getElementById('s').innerText=score;let a=document.getElementById('atom');a.style.transform='scale(1.3)';setTimeout(()=>a.style.transform='scale(1)',150)}
function reset(){score=0;document.getElementById('s').innerText=score}
</script>
</body>
</html>
