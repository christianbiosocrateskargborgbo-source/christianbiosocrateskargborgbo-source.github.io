
<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>OSSA CLASS OF 94</title>
<style>
body{margin:0;background:#020812;color:white;font-family:sans-serif;text-align:center;overflow-x:hidden}
h1{margin-top:25px;color:#22c55e;font-size:30px;letter-spacing:1px}
.sub{color:#aaa;font-size:15px;line-height:1.4}
.string{width:4px;height:70px;background:white;margin:0 auto;box-shadow:0 0 10px #fff}
.capsule{width:140px;height:220px;margin:0 auto;background:linear-gradient(to bottom,#16a34a 0%,#16a34a 38%,#ffffff 38%,#ffffff 62%,#2563eb 62%,#2563eb 100%);border-radius:80px;border:4px solid white;box-shadow:0 0 40px #22c55e, 0 0 80px #22c55e33;animation:swing 2.2s ease-in-out infinite;transform-origin:top center}
@keyframes swing{0%{transform:rotate(-14deg)}50%{transform:rotate(14deg)}100%{transform:rotate(-14deg)}}
.atoms-wrap{display:flex;justify-content:center;gap:12px;flex-wrap:wrap;max-width:340px;margin:35px auto 10px}
.atom{width:55px;height:55px;border-radius:50%;position:relative;animation:spin 2.5s linear infinite, float 3s ease-in-out infinite}
.atom:before{content:'';position:absolute;inset:8px;background:currentColor;border-radius:50%;box-shadow:0 0 15px currentColor}
.atom:after{content:'';position:absolute;top:50%;left:-6px;right:-6px;height:2px;border:2px solid currentColor;border-radius:50%;transform:rotate(20deg)}
.atom:nth-child(1){color:#22c55e;border:2px solid #22c55e}
.atom:nth-child(2){color:#ffffff;border:2px solid #ffffff}
.atom:nth-child(3){color:#3b82f6;border:2px solid #3b82f6}
.atom:nth-child(4){color:#22c55e;border:2px dashed #22c55e}
.atom:nth-child(5){color:#ffffff;border:2px dashed #ffffff}
.atom:nth-child(6){color:#3b82f6;border:2px dashed #3b82f6}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes float{0%,100%{transform:translateY(0) rotate(0deg)}50%{transform:translateY(-8px) rotate(5deg)}}
.fire{font-size:12px;letter-spacing:4px;animation:blink 1s infinite}
@
