<!DOCTYPE html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1"><title>KARGBO GAME 👑</title><style>*{margin:0;padding:0;box-sizing:border-box}body{background:#000;color:gold;font-family:system-ui;overflow:hidden;text-align:center}h1{font-size:22px;margin:8px;text-shadow:0 0 10px gold}#hud{display:flex;justify-content:space-around;background:#111;padding:8px;border-bottom:2px solid gold;font-weight:900}#game{position:relative;width:100%;height:70vh;background:linear-gradient(#000 0%, #1a1a00 100%);overflow:hidden;border:3px solid gold}#player{position:absolute;left:20px;bottom:40px;width:50px;height:50px;background:gold;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:28px;border:3px solid #fff;box-shadow:0 0 20px gold;transition:bottom .15s}.atom{position:absolute;width:45px;height:45px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:24px;background:#222;border:2px solid gold;box-shadow:0 0 15px gold}.ground{position:absolute;bottom:0;width:100%;height:30px;background:linear-gradient(gold,#b8860b)}.btn{position:absolute;bottom:50px;width:48%;height:60px;border-radius:15px;border:3px solid gold;font-weight:900;font-size:18px}.controls{position:absolute;bottom:40px;width:100%;display:flex;justify-content:space-between;padding:0 10px}#l{left:10px;background:#111;color:gold}#r{right:10px;background:gold;color:#000}#start{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);background:gold;color:#000;padding:18px 30px;border-radius:30px;font-weight:900;font-size:20px;border:none;box-shadow:0 0 30px gold;z-index:10}</style></head><body><h1>👑 KARGBO RUNNER 🇸🇱</h1><div id="hud"><span>SCORE: <b id="sc">0</b></span><span>ATOMS: <b id="at">0</b>/20</span><span>BEST: <b id="bs">0</b></span></div><div id="game"><div id="player">🤵🏿</div><div class="ground"></div><button id="start" onclick="startGame()">TAP TO START 👑</button>
